# 校验 workflow：只做一件事——**坏代码不该进主分支**（跑 test + lint）
#
# **本仓库仅研究用途、不对外发布任何打包版**（见 README「关于本仓库」）。因此这里**没有打包 job、
# 也没有 upload-artifact**：公开仓库的 Actions Artifacts 对任何登录且有 read 权限的用户可下载，
# 它本身就是个分发口。想给自己打包：在**你自己的机器**上按 README 的「自行构建 / 想自己造包」做
# （本仓库不提供任何二进制，也不在这里产出）。
#
# 注意：test 与 lint 都不需要 Electron 二进制（vitest 里 electron 走桩），所以这里不需要配
# ELECTRON_MIRROR / NODEJS_ORG_MIRROR；若将来往 CI 里加真的打包步骤，先看 README 里
# 「装依赖」那两条必踩的坑（node-gyp 的头文件与 Electron 二进制都要走镜像或代理）。
#
# 为什么这里有 typecheck：构建期只有 webpack 的 ts-loader 会查类型，而 CI **不跑 build**
# （只为校验、不产包，见上面 ADR-0008 那段）——于是 TS 类型错误在 CI 里完全没有门禁，能一路进
# main。npm run typecheck 用三个构建目标的 tsconfig 各跑一遍 tsc --noEmit，补上这条缝。
# 口径由全历史自审查（2026-09-26）定，落点约定见 docs/agents/self-review.md（本机-only）。
#
# runner 与 action 版本口径（2026-10-17 定）：
# - `runs-on` 钉到具名镜像，不用 `ubuntu-latest`——后者自 2026-10-19 起开始迁往 Ubuntu 26，
#   留着会既收到迁移通知、又让「CI 跑在哪个系统上」随 GitHub 的时间表变。要升镜像就显式改这一行。
# - action 用最新 major（v7）：v4 那代跑在 Node 20 运行时上，运行页会挂一条弃用警告。
name: verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
